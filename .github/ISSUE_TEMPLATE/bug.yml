name: Bug report
description: Something isn't working as expected
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: e.g. "Samwise shows planted crops as 'Unknown' after the IInventoryService refactor."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Concrete sequence — what you did, what files / log lines were involved.
      placeholder: |
        1. Launch Mithril with character X logged into game.
        2. Plant any crop.
        3. Open Samwise tab.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What should have happened, vs. what did.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module is affected? After create, apply the matching `module:*` label manually (no auto-applier wired yet — see #1024).
      options:
        - shell
        - samwise
        - pippin
        - legolas
        - arwen
        - elrond
        - gandalf
        - bilbo
        - saruman
        - smaug
        - celebrimbor
        - palantir
        - silmarillion
        - mithril.gamestate
        - mithril.reference
        - cross-module / unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which cross-cutting area, if any? After create, apply the matching `area:*` label manually.
      options:
        - none
        - arda
        - ci
        - docs
        - gamestate-services
        - map-calibration
        - parser
        - performance
        - telemetry
        - test
        - ui
    validations:
      required: false

  - type: checkboxes
    id: flags
    attributes:
      label: Flags
      description: Tick any that apply. After create, apply the corresponding labels manually (`regression`, `area:performance`).
      options:
        - label: Regression — previously-working behavior broke from a known change
        - label: Performance issue — slowness, stalls, regressions in wall-clock or resource use

  - type: textarea
    id: context
    attributes:
      label: Logs, environment, links
      description: Anything else that helps — relevant `Player.log` lines, app version, related PR / issue links.
